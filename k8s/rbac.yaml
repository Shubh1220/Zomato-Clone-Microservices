apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-zomato-app-user
  namespace: my-zomato-app

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: my-zomato-app-manager
  namespace: my-zomato-app

rules:
  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch

  # Deployment resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: my-zomato-app-manager-binding
  namespace: my-zomato-app

subjects:
  - kind: ServiceAccount
    name: my-zomato-app-user
    namespace: my-zomato-app

roleRef:
  kind: Role
  name: my-zomato-app-manager
  apiGroup: rbac.authorization.k8s.io
